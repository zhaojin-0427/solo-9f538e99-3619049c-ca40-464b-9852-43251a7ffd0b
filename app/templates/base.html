<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}碳核算台账标准化{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">碳核算台账标准化</a>
    <span class="tagline">字段合同驱动的能源台账对齐</span>
    <nav class="site-nav">
      <a href="/">标准化校验</a>
      <a href="/archive">批次归档</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    所有校验均在服务器内存中完成；只有完全合格时才会生成标准列 CSV。
    归档批次仅在校验通过后发布：原件、结果、字段映射与 SHA-256 一并持久保存，可凭批次号复查。
  </footer>
</body>
</html>
