services:
  ledger-standardizer:
    build: .
    image: carbon-ledger-standardizer:latest
    container_name: carbon-ledger-standardizer
    ports:
      - "8000:8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - ARCHIVE_DATA_DIR=/srv/data
    volumes:
      # Named volume keeps published batches (files + SQLite) across
      # container restarts and rebuilds; the read_only root fs does not
      # apply to mounted volumes.
      - archive-data:/srv/data

volumes:
  archive-data:
